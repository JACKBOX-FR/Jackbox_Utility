name: build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      # Dépendances Linux requises pour Tauri v2 / v1
      - if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: npm install
        working-directory: jackbox_patcher

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: jackbox_patcher
          # Utilise le tag si existant, sinon utilise le nom du déclencheur manuel
          tagName: ${{ github.ref_name }}
          releaseName: 'Jackbox Utility ${{ github.ref_name }}'
          releaseDraft: true
          # Optionnel : force la création d'un tag si vous lancez en manuel
          includeRelease: ${{ github.ref_type == 'tag' }}
