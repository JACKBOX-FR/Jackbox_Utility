<!doctype html><meta charset="utf-8"><title>jbx</title>
<style>
body{font:15px system-ui;margin:0;background:#16161d;color:#eee}
main{max-width:780px;margin:auto;padding:20px}
section{background:#22222c;border-radius:10px;padding:16px;margin-bottom:14px}
h2{margin:0 0 10px;font-size:16px;color:#ffc933}
button,select,input,textarea{font:inherit;padding:7px 10px;border-radius:6px;border:1px solid #444;background:#2e2e3a;color:#eee}
button{cursor:pointer;background:#ffc933;color:#000;border:0}
button.chip{background:#2e2e3a;color:#eee;border:1px solid #555;padding:3px 9px;margin:2px}
button.chip.on{background:#ffc933;color:#000}
textarea{width:100%;height:260px;box-sizing:border-box;font-family:monospace}
details{margin:6px 0} details>div{margin:4px 0 4px 14px}
pre{white-space:pre-wrap;color:#9cf;margin:6px 0 0}
#log{white-space:pre-wrap;color:#8f8}
#modal{display:none;position:fixed;inset:0;background:#000a;align-items:center;justify-content:center}
#modal>div{background:#22222c;padding:20px;border-radius:10px;max-width:420px}
</style>
<main>
<section><h2 data-i="ui_server">Server</h2>
 <select id="srv"></select> <input id="custom" size="30"> <button id="apply" data-i="ui_apply">Apply</button></section>
<section><h2 data-i="ui_local">Local</h2>
 <button id="start" data-i="ui_start">Start</button> <button id="stop" data-i="ui_stop">Stop</button>
 <div id="addr"></div>
 <div><button id="dump" data-i="ui_dump">Dump</button> <input id="xf" size="34" placeholder="main/pp7/everyday/script.js"> <button id="xs" data-i="ui_extract">Extract</button></div></section>
<section><h2 data-i="ui_catalog">Catalog</h2>
 <select id="cat"></select> <button id="load" data-i="ui_load">Load</button> <button id="detect" data-i="ui_detect">Detect</button>
 <div id="srvinfo"></div><div id="news"></div><div id="tags"></div><div id="packs"></div></section>
<section><h2 data-i="ui_jb">Serveur complet hors-ligne (Jonahbox)</h2>
 <div id="jbstatus"></div><div id="jbbtns"></div><pre id="jbout"></pre></section>
<section><h2 data-i="ui_patch">Patch</h2>
 <button id="install" data-i="ui_install">Install</button> <button id="restore" data-i="ui_restore">Restore</button></section>
<section><h2 data-i="ui_config">Config</h2><div id="dir"></div>
 <textarea id="cfg"></textarea><br><button id="save" data-i="ui_save">Save</button></section>
<div id="log"></div>
</main>
<div id="modal"><div><h2 id="mt"></h2><p id="mb"></p><button id="yes"></button> <button id="no"></button></div></div>
<script src="app.js"></script>
