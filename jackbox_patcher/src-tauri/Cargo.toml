[package]
name = "jbx"
version = "0.1.0"
edition = "2021"

# Compile les dépendances en optimisé même en debug (sinon zip/JSON/hash sont très lents sous `tauri dev`)
[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
anyhow = "1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
toml_edit = "0.22"
walkdir = "2"
regex = "1"
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["net", "sync", "time"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking", "json"] }
zip = "2"
open = "5"
getrandom = "0.2"
aho-corasick = "1"
sha1 = "0.10"
mime_guess = "2"
time = "0.3"
igd-next = "0.14"
axum-server = { version = "0.8", features = ["tls-rustls"] }
rcgen = "0.13"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
